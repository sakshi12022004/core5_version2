<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" width="80" height="64" fill="none">
  <defs>
    <linearGradient id="org-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F4BB9" />
    </linearGradient>
  </defs>
  <!-- Shield Contour with very light tint fill -->
  <path d="M40 6 L64 15 C64 36 52 50 40 58 C28 50 16 36 16 15 Z" 
