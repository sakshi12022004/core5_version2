    <path d="M16 32 H36 a8 8 0 0 1 0 16 H16 Z" fill="url(#bai-strata)"/>
    <!-- Network Link Line -->
    <path d="M33 13 L28 26.5 L36 40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Neural Nodes -->
    <circle cx="33" cy="13" r="3.2" fill="#FFFFFF"/>
    <circle cx="33" cy="13" r="1.6" fill="#0F4BB9"/>
    <circle cx="28" cy="26.5" r="2.5" fill="#FFFFFF"/>
    <!-- Signature Sovereign Gold/Champagne Node -->
    <circle cx="36" cy="40" r="4.2" fill="url(#bai-accent)"/>
    <circle cx="36" cy="40" r="1.8" fill="#FFFFFF"/>
    <!-- AI Matrix Sparkles -->
    <polygon points="45,8 46,11 49,12 46.5,14 47,17 45,15 43,17 43.5,14 41,12 44,11" fill="#F59E0B"/>
    <circle cx="4" cy="24" r="1.5" fill="#38BDF8"/>
  </g>
