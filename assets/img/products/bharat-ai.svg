<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64" width="80" height="64" fill="none">
  <defs>
    <linearGradient id="bai-strata" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F4BB9" />
    </linearGradient>
    <linearGradient id="bai-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <g transform="translate(18, 6)">
    <!-- Main Spine -->
    <rect x="6" y="5" width="8" height="42" rx="3" fill="#0F4BB9"/>
    <!-- Top Stratum (LLM Core) -->
    <path d="M16 5 H33 a8 8 0 0 1 0 16 H16 Z" fill="url(#bai-strata)"/>
