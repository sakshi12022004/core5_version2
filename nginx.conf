# Core5 Website - Nginx Reverse Proxy & Static Server Configuration
# Place in /etc/nginx/sites-available/core5 and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name core5.co.in www.core5.co.in;

    # Root directory for static assets
    root /var/www/core5webpageV2;
    index index.html;

    # Gzip Compression for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API / dynamic contact form to backend app (Node.js or Python Gunicorn on port 3000)
    location /send {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
